[workspace]
resolver = "3"
members = [
    "crates/ps5-format",
    "crates/ps5-self",
    "crates/ps5-elf",
    "crates/ps5-nid",
    "crates/ps5-analysis",
    "crates/ps5-image",
    "crates/ps5-dashboard",
    "crates/ps5-cli",
    "crates/ps5-loader",
    "crates/ps5-emu",
    "crates/ps5-ble-loader",
    "crates/ps5-memory-safe",
    "crates/ps5-deps",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"
authors = ["claimore22"]
repository = "https://github.com/claimore22/ps5rs"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "forbid"

name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            asset_suffix: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            asset_suffix: windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p ps5-cli -p import-game

      - name: Stage assets
        shell: bash
        run: |
          mkdir -p dist
          VER="${{ github.ref_name }}"
          if [ -f target/${{ matrix.target }}/release/ps5rs${{ matrix.ext }} ]; then
            cp target/${{ matrix.target }}/release/ps5rs${{ matrix.ext }} "dist/ps5rs-${VER}-${{ matrix.asset_suffix }}"
          else
            cp target/${{ matrix.target }}/release/ps5-cli${{ matrix.ext }} "dist/ps5rs-${VER}-${{ matrix.asset_suffix }}"
          fi
          cp target/${{ matrix.target }}/release/import-game${{ matrix.ext }} "dist/import-game-${VER}-${{ matrix.asset_suffix }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.asset_suffix }}
          path: dist/

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -R dist

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ps5rs ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: dist/*

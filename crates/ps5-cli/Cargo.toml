[package]
name = "ps5-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for PS5 binary inspection"

[[bin]]
name = "ps5rs"
path = "src/main.rs"

[features]
integration = []

[dependencies]
ps5-format = { path = "../ps5-format" }
ps5-self = { path = "../ps5-self" }
ps5-elf = { path = "../ps5-elf" }
ps5-nid = { path = "../ps5-nid" }
ps5-image = { path = "../ps5-image" }
ps5-analysis = { path = "../ps5-analysis" }
ps5-dashboard = { path = "../ps5-dashboard" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
